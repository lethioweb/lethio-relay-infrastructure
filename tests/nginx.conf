worker_processes 1;
pid tests/runtime/nginx.pid;
error_log stderr;

events {
    worker_connections 32;
}

http {
    access_log off;
    client_body_temp_path tests/runtime/body;
    proxy_temp_path tests/runtime/proxy;
    fastcgi_temp_path tests/runtime/fastcgi;
    uwsgi_temp_path tests/runtime/uwsgi;
    scgi_temp_path tests/runtime/scgi;

    include ../nginx/lethio-off-relay-rate-limit.conf;

    server {
        listen 127.0.0.1:18080;
        server_name localhost;
        include ../nginx/lethio-off-relay-location.conf;
    }
}
