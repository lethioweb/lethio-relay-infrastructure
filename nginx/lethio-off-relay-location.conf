# Include inside exactly one TLS vhost. The public surface is an exact-match location so adjacent
# paths never reach the relay.
location = /v1/off/contributions {
    access_log off;
    error_log /dev/null crit;
    error_page 403 = @lethio_off_relay_method_not_found;
    error_page 413 = @lethio_off_relay_too_large;
    error_page 429 = @lethio_off_relay_rate_limited;
    error_page 500 502 504 = @lethio_off_relay_unavailable;

    limit_except POST {
        deny all;
    }
    limit_req zone=lethio_off_relay_per_ip burst=2 nodelay;
    limit_req_status 429;

    client_max_body_size 2k;
    client_body_buffer_size 4k;
    client_body_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";

    # Discard client arguments and replace the complete upstream request target with the fixed API
    # path instead of relying on proxy_pass's subtle empty-query behavior.
    set $args "";
    proxy_pass http://127.0.0.1:8087/v1/off/contributions;
    proxy_connect_timeout 1s;
    proxy_send_timeout 5s;
    proxy_read_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_intercept_errors on;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
}

# Machine failures stay inside the machine API. These internal handlers avoid the parent site's
# human-facing error pages and ordinary access log.
location @lethio_off_relay_method_not_found {
    internal;
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    return 404 '{"status":"not_found"}';
}

location @lethio_off_relay_rate_limited {
    internal;
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    return 429 '{"status":"rate_limited"}';
}

location @lethio_off_relay_too_large {
    internal;
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    return 413 '{"status":"refused"}';
}

location @lethio_off_relay_unavailable {
    internal;
    access_log off;
    error_log /dev/null crit;
    default_type application/json;
    return 503 '{"status":"unavailable"}';
}
